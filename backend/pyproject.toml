[project]
name = "llm-pipeline-explorer-backend"
version = "0.1.0"
description = "Python backend for the LLM Pipeline Explorer application."
authors = [
    {name = "Devilfish281",email = "Dobley@csu.fullerton.edu"}
]
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi[standard] (>=0.139.2,<0.140.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "numpy (>=2.5.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.15.22,<0.16.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "httpx2 (>=2.7.0,<3.0.0)",
    "black (==26.1.0)"
]

[tool.poetry]
packages = [
    { include = "how_llms_work", from = "src" }
]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.black]
target-version = ["py312"]
line-length = 100


[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
